<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Critical Alerts - PRISM-SIF</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-container":"#191f2f","surface-container-high":"#242a3a","on-surface":"#f1f5f9","error":"#ef4444","secondary":"#d0bcff","outline":"#8c909f"}}}}
    </script>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --border-glass: rgba(255, 255, 255, 0.08);
            --bg-card: rgba(17, 24, 39, 0.8);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: #f1f5f9;
            min-height: 100vh;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .incident-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .incident-card:hover {
            border-color: rgba(239, 68, 68, 0.4);
        }
        .badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="flex items-center gap-4">
            <a href="/" class="flex items-center text-outline hover:text-white transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="ml-2 font-semibold">Back to Dashboard</span>
            </a>
            <h1 class="text-xl font-bold bg-gradient-to-r from-error to-secondary bg-clip-text text-transparent ml-4">
                Critical Alerts
            </h1>
        </div>
    </header>

    <main class="container">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Critical Incident Reports</h2>
            <div class="text-outline text-sm" id="loading-state">Loading...</div>
        </div>

        <div id="incidents-container">
            <!-- Incidents will be injected here -->
        </div>
        
        <div class="flex justify-center mt-6 hidden" id="pagination-controls">
            <button id="btn-prev" class="px-4 py-2 border border-outline rounded-l hover:bg-surface-container-high disabled:opacity-50">Previous</button>
            <span class="px-4 py-2 border-t border-b border-outline flex items-center" id="page-indicator">Page 1</span>
            <button id="btn-next" class="px-4 py-2 border border-outline rounded-r hover:bg-surface-container-high disabled:opacity-50">Next</button>
        </div>
    </main>

    <script>
        let currentPage = 1;
        const perPage = 50;

        async function fetchIncidents(page) {
            const container = document.getElementById('incidents-container');
            const loading = document.getElementById('loading-state');
            const pagination = document.getElementById('pagination-controls');
            
            loading.textContent = 'Loading...';
            
            try {
                const res = await fetch(`/api/v1/incidents?risk_level=critical&sort_by=date&page=${page}&per_page=${perPage}`);
                const data = await res.json();
                
                container.innerHTML = '';
                
                if (!data.incidents || data.incidents.length === 0) {
                    container.innerHTML = '<div class="text-outline text-center py-10">No critical alerts found.</div>';
                    pagination.classList.add('hidden');
                } else {
                    data.incidents.forEach(inc => {
                        const dateStr = inc.event_date ? new Date(inc.event_date).toLocaleDateString() : 'Unknown Date';
                        
                        const card = document.createElement('div');
                        card.className = 'incident-card';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <div class="flex items-center gap-3 mb-1">
                                        <span class="badge flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">crisis_alert</span> CRITICAL</span>
                                        <span class="text-sm font-semibold text-outline">${dateStr}</span>
                                        <span class="text-sm text-outline px-2 border-l border-outline/30">${inc.state} - ${inc.city}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-white mt-2">${inc.employer || 'Unknown Employer'}</h3>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-black text-error">${inc.risk_score.toFixed(1)}</div>
                                    <div class="text-xs text-outline uppercase tracking-wider">Risk Score</div>
                                </div>
                            </div>
                            <p class="text-sm text-gray-300 mt-2 mb-4 leading-relaxed">${inc.narrative}</p>
                            <div class="flex gap-4 text-xs text-outline">
                                <div class="flex gap-1 items-center">
                                    <span class="material-symbols-outlined text-[16px]">warning</span>
                                    ${inc.event_type || 'Unknown Event'}
                                </div>
                                <div class="flex gap-1 items-center">
                                    <span class="material-symbols-outlined text-[16px]">medical_services</span>
                                    ${inc.nature || 'Unknown Nature'}
                                </div>
                                ${inc.hospitalized ? '<div class="flex gap-1 items-center text-amber-400"><span class="material-symbols-outlined text-[16px]">local_hospital</span> Hospitalized</div>' : ''}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                    
                    document.getElementById('page-indicator').textContent = `Page ${data.page} of ${data.total_pages}`;
                    document.getElementById('btn-prev').disabled = data.page <= 1;
                    document.getElementById('btn-next').disabled = data.page >= data.total_pages;
                    pagination.classList.remove('hidden');
                }
                
                loading.textContent = `Showing ${data.incidents.length} of ${data.total} critical alerts (Ordered newest to oldest)`;
            } catch (err) {
                console.error(err);
                loading.textContent = 'Error loading alerts.';
            }
        }

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                fetchIncidents(currentPage);
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            currentPage++;
            fetchIncidents(currentPage);
        });

        // Initial load
        fetchIncidents(currentPage);
    </script>
</body>
</html>
