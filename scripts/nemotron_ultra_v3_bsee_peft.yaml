trainer:
  devices: 4
  num_nodes: 4
  accelerator: gpu
  precision: bf16-mixed

model:
  micro_batch_size: 1
  global_batch_size: 32
  seq_length: 2048
  peft:
    peft_scheme: lora
    lora_tuning_roles: ['attention', 'mlp']
    lora_dim: 16
    lora_alpha: 32
  
  data:
    data_prefix:
      - 1.0
      - /data/fine_tuning/bsee_training_data.jsonl
    dataset_type: 'gpt'
    chat: True
